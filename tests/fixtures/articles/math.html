<!doctype html>
<html>
  <head><title>Why Sampling Works</title></head>
  <body>
    <article>
      <h1>Why Sampling Works</h1>
      <p>The estimate improves as the number of independent samples increases.</p>
      <p>The relationship is described by the following equation:</p>
      <math display="block" aria-label="The square root of n times the mean">
        <mi>σ</mi><mo>=</mo><mfrac><mi>1</mi><msqrt><mi>n</mi></msqrt></mfrac>
      </math>
      <p>Inline notation also appears in the sentence: <math><mi>x</mi><mo>+</mo><mi>y</mi><mo>=</mo><mi>z</mi></math>.</p>
      <p>The equation is meaningful content and must not disappear during extraction.</p>
    </article>
  </body>
</html>
