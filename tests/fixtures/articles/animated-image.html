<!doctype html>
<html>
  <head><title>Frames in Motion</title></head>
  <body>
    <article>
      <h1>Frames in Motion</h1>
      <p>This fixture references an animated image without embedding a player or script.</p>
      <figure>
        <img src="/media/rolling-chart.webp" alt="A chart that adds one point per frame" width="640" height="360">
        <figcaption>The animation shows the chart growing one point at a time.</figcaption>
      </figure>
      <p>The browser can decode the image through the normal image element.</p>
    </article>
  </body>
</html>
