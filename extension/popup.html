<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Capture to Readr</title>
    <style>
      :root {
        color-scheme: light dark;
        font: 14px/1.4 system-ui, sans-serif;
        --popup-bg: Canvas;
        --popup-fg: CanvasText;
        --popup-muted: GrayText;
        --action-bg: #292929;
        --action-bg-hover: #3a3a3a;
        --action-fg: #fff;
        --focus-ring: Highlight;
        --success: #16803c;
        --error: #b42318;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --success: #7ee2a8;
          --error: #ff9b91;
        }
      }

      * { box-sizing: border-box; }

      body {
        width: 320px;
        margin: 0;
        padding: 18px;
        color: var(--popup-fg);
        background: var(--popup-bg);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 18px;
        font-weight: 650;
        line-height: 1.2;
        letter-spacing: -0.01em;
        text-wrap: balance;
      }

      .helper {
        margin: 0 0 16px;
        color: var(--popup-muted);
        font-size: 13px;
        line-height: 1.45;
        text-wrap: pretty;
      }

      button {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        min-height: 44px;
        padding: 10px 14px;
        border: 0;
        border-radius: 10px;
        color: var(--action-fg);
        background: var(--action-bg);
        box-shadow: 0 1px 1px rgb(0 0 0 / 0.15), 0 3px 8px rgb(0 0 0 / 0.12);
        cursor: pointer;
        transition-property: background-color, box-shadow, transform, opacity;
        transition-duration: 120ms;
        transition-timing-function: ease-out;
      }

      button:hover:not(:disabled) {
        background: var(--action-bg-hover);
        box-shadow: 0 2px 2px rgb(0 0 0 / 0.16), 0 5px 12px rgb(0 0 0 / 0.16);
      }

      button:active:not(:disabled) { transform: scale(0.96); }

      button:focus-visible {
        outline: 2px solid var(--focus-ring);
        outline-offset: 3px;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      .button-spinner {
        display: none;
        width: 15px;
        height: 15px;
        flex: 0 0 15px;
        border: 2px solid rgb(255 255 255 / 0.35);
        border-top-color: currentColor;
        border-radius: 50%;
      }

      button.is-busy .button-spinner {
        display: inline-block;
        animation: spin 700ms linear infinite;
      }

      .status {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        min-height: 20px;
        margin: 12px 0 0;
        color: var(--popup-muted);
        font-size: 13px;
        line-height: 1.4;
        overflow-wrap: anywhere;
      }

      .status[data-state="success"] { color: var(--success); }
      .status[data-state="error"] { color: var(--error); }

      .status-icon {
        display: inline-grid;
        place-items: center;
        width: 1.1em;
        min-width: 1.1em;
        height: 1.4em;
        font-weight: 700;
      }

      .status[data-state="success"] .status-icon::before { content: "✓"; }
      .status[data-state="error"] .status-icon::before { content: "!"; }
      .status[data-state="idle"] .status-icon { visibility: hidden; }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }

        button:active:not(:disabled) { transform: none; }
      }
    </style>
  </head>
  <body>
    <h1>Capture to Readr</h1>
    <p class="helper">Open YouTube’s Show transcript panel before capturing.</p>
    <button id="capture" type="button" aria-describedby="status">
      <span class="button-spinner" aria-hidden="true"></span>
      <span id="button-label">Capture current video</span>
    </button>
    <p id="status" class="status" data-state="idle" role="status" aria-live="polite" aria-atomic="true" aria-busy="false">
      <span class="status-icon" aria-hidden="true"></span>
      <span id="status-text"></span>
    </p>
    <script src="popup.js"></script>
  </body>
</html>
