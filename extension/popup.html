<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Capture to Readr</title>
    <style>
      :root { color-scheme: light dark; font: 14px system-ui, sans-serif; }
      body { width: 260px; margin: 0; padding: 16px; color: CanvasText; background: Canvas; }
      h1 { margin: 0 0 8px; font-size: 16px; }
      p { margin: 0 0 14px; color: GrayText; line-height: 1.4; }
      button { width: 100%; padding: 9px 12px; border: 0; border-radius: 8px; color: white; background: #292929; cursor: pointer; }
      button:disabled { cursor: wait; opacity: 0.6; }
      #status { min-height: 20px; margin-top: 12px; }
    </style>
  </head>
  <body>
    <h1>Capture to Readr</h1>
    <p>Open YouTube’s Show transcript panel before capturing.</p>
    <button id="capture" type="button">Capture current video</button>
    <p id="status" role="status" aria-live="polite"></p>
    <script src="popup.js"></script>
  </body>
</html>
